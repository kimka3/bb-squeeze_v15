name: Paper execution safety

on:
  push:
    branches: ['codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: paper-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-paper.lock
      - run: python -m pip install -r requirements-paper.lock -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python src/live/replay.py --bars 400
      - name: Verify shell syntax
        run: |
          bash -n scripts/run_paper.sh
          bash -n scripts/paper_preflight.sh
          bash -n scripts/install_paper_systemd.sh
